<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Progress on the task board API written in Go" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <clipPath id="win"><rect width="900" height="250" rx="14"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace; }
    .t { font-size: 12px; fill: #8b949e; }
    .l { font-size: 16px; fill: #e6edf3; }
    .p { font-size: 14px; fill: #8b949e; }
    .bar { transform-box: fill-box; transform-origin: 0 50%; animation: grow 9s cubic-bezier(.2,.8,.2,1) infinite; }
    .b2 { animation-delay: .15s } .b3 { animation-delay: .30s } .b4 { animation-delay: .45s }
    @keyframes grow { 0%{transform:scaleX(0)} 22%,88%{transform:scaleX(1)} 96%,100%{transform:scaleX(0)} }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25 } }
    .shine { animation: shine 3.2s linear infinite; }
    @keyframes shine { from { transform: translateX(-120px) } to { transform: translateX(760px) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#win)">
    <rect width="900" height="250" fill="#0d1117"/>
    <rect width="900" height="36" fill="#161b22"/>
    <rect y="36" width="900" height="1" fill="#30363d"/>
    <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="66" cy="18" r="6" fill="#27c93f"/>
    <text x="450" y="22" text-anchor="middle" class="t">task-board-api / main.go</text>
    <circle class="pulse" cx="840" cy="18" r="4.5" fill="#3fb950"/>
    <text x="852" y="22" class="t">wip</text>

    <!-- rows -->
    <text class="l" x="40" y="88">boards</text>
    <rect x="200" y="75" width="560" height="14" rx="7" fill="#21262d"/>
    <rect class="bar b1" x="200" y="75" width="560" height="14" rx="7" fill="url(#bar)"/>
    <text class="p" x="780" y="88">100%</text>

    <text class="l" x="40" y="128">tasks</text>
    <rect x="200" y="115" width="560" height="14" rx="7" fill="#21262d"/>
    <rect class="bar b2" x="200" y="115" width="448" height="14" rx="7" fill="url(#bar)"/>
    <text class="p" x="780" y="128">80%</text>

    <text class="l" x="40" y="168">auth</text>
    <rect x="200" y="155" width="560" height="14" rx="7" fill="#21262d"/>
    <rect class="bar b3" x="200" y="155" width="224" height="14" rx="7" fill="url(#bar)"/>
    <text class="p" x="780" y="168">40%</text>

    <text class="l" x="40" y="208">members</text>
    <rect x="200" y="195" width="560" height="14" rx="7" fill="#21262d"/>
    <rect class="bar b4" x="200" y="195" width="112" height="14" rx="7" fill="url(#bar)"/>
    <text class="p" x="780" y="208">20%</text>

    <rect class="shine" x="0" y="37" width="3" height="213" fill="#a371f7" opacity=".10"/>
  </g>
  <rect x=".5" y=".5" width="899" height="249" rx="14" fill="none" stroke="#30363d"/>
</svg>
