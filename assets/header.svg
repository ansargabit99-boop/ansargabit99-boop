
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Terminal window: ansar, full stack and backend developer, golang. Building a task board API in Go." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glowG"><stop offset="0" stop-color="#2ea043" stop-opacity=".30"/><stop offset="1" stop-color="#2ea043" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowP"><stop offset="0" stop-color="#a371f7" stop-opacity=".30"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#30363d" stroke-width=".6" opacity=".55"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="30 30" dur="6s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="win"><rect width="900" height="340" rx="14"/></clipPath>
    <clipPath id="c1"><rect class="w w1" x="40" y="72" height="28"/></clipPath>
    <clipPath id="c2"><rect class="w w2" x="40" y="104" height="28"/></clipPath>
    <clipPath id="c3"><rect class="w w3" x="40" y="156" height="28"/></clipPath>
    <clipPath id="c4"><rect class="w w4" x="40" y="188" height="28"/></clipPath>
    <clipPath id="c5"><rect class="w w5" x="40" y="220" height="28"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace; }
    .code { font-size: 18px; }
    .title { font-size: 12px; fill: #8b949e; }
    .logo { font-size: 28px; font-weight: 700; fill: #3fb950; }
    .w { width: 0; }
    .w1 { animation: t1 14s steps(8)  infinite; }
    .w2 { animation: t2 14s steps(41) infinite; }
    .w3 { animation: t3 14s steps(13) infinite; }
    .w4 { animation: t4 14s steps(45) infinite; }
    .w5 { animation: t5 14s steps(43) infinite; }
    @keyframes t1 { 0%,3%{width:0}   10%,94%{width:86.4px}  97%,100%{width:0} }
    @keyframes t2 { 0%,12%{width:0}  16%,94%{width:442.8px} 97%,100%{width:0} }
    @keyframes t3 { 0%,22%{width:0}  29%,94%{width:140.4px} 97%,100%{width:0} }
    @keyframes t4 { 0%,33%{width:0}  38%,94%{width:486px}   97%,100%{width:0} }
    @keyframes t5 { 0%,40%{width:0}  45%,94%{width:464.4px} 97%,100%{width:0} }
    .show  { animation: show 14s linear infinite; }
    @keyframes show { 0%,50%{opacity:0} 51%,94%{opacity:1} 96%,100%{opacity:0} }
    .blink { animation: blink 1.06s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .spinA { animation: spin 22s linear infinite; transform-origin: 0 0; }
    .spinB { animation: spin 14s linear infinite reverse; transform-origin: 0 0; }
    .spinC { animation: spin 8s  linear infinite; transform-origin: 0 0; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .float { animation: float 4s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-6px) } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .w { width: 900px !important; }
      .show { opacity: 1 !important; }
    }
  </style>

  <g clip-path="url(#win)">
    <rect width="900" height="340" fill="url(#bg)"/>
    <rect width="900" height="340" fill="url(#grid)"/>

    <circle cx="120" cy="60" r="190" fill="url(#glowG)">
      <animate attributeName="cx" values="120;300;120" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;300;60" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="300" r="200" fill="url(#glowP)">
      <animate attributeName="cx" values="780;600;780" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;60;300" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- title bar -->
    <rect width="900" height="36" fill="#161b22"/>
    <rect y="36" width="900" height="1" fill="#30363d"/>
    <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="66" cy="18" r="6" fill="#27c93f"/>
    <text x="450" y="22" text-anchor="middle" class="title">ansar@dev: ~/profile</text>

    <!-- terminal lines -->
    <g clip-path="url(#c1)">
      <text class="code" x="40" y="92" textLength="86.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#3fb950">$</tspan> <tspan fill="#e6edf3">whoami</tspan></text>
    </g>
    <g clip-path="url(#c2)">
      <text class="code" x="40" y="124" textLength="442.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#a371f7" font-weight="700">ansar</tspan><tspan fill="#8b949e"> — </tspan><tspan fill="#e6edf3">full stack dev</tspan><tspan fill="#8b949e"> · </tspan><tspan fill="#e6edf3">backend</tspan><tspan fill="#8b949e"> · </tspan><tspan fill="#00ADD8">golang</tspan></text>
    </g>
    <g clip-path="url(#c3)">
      <text class="code" x="40" y="176" textLength="140.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#3fb950">$</tspan> <tspan fill="#e6edf3">cat now.txt</tspan></text>
    </g>
    <g clip-path="url(#c4)">
      <text class="code" x="40" y="208" textLength="486" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#8b949e">building</tspan><tspan fill="#3fb950">  → </tspan><tspan fill="#e6edf3">trello-style task board api in </tspan><tspan fill="#00ADD8">go</tspan></text>
    </g>
    <g clip-path="url(#c5)">
      <text class="code" x="40" y="240" textLength="464.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#8b949e">learning</tspan><tspan fill="#3fb950">  → </tspan><tspan fill="#e6edf3">rest apis</tspan><tspan fill="#8b949e"> · </tspan><tspan fill="#e6edf3">auth</tspan><tspan fill="#8b949e"> · </tspan><tspan fill="#e6edf3">architecture</tspan></text>
    </g>
    <g class="show">
      <text class="code" x="40" y="292" fill="#3fb950">$</text>
      <g class="blink"><rect x="61.6" y="276" width="10.8" height="22" fill="#3fb950"/></g>
    </g>

    <!-- right side: orbit emblem -->
    <g transform="translate(740 190)">
      <g class="float">
        <circle r="100" fill="none" stroke="#2ea043" stroke-opacity=".35" stroke-dasharray="3 11" class="spinA"/>
        <circle r="72" fill="none" stroke="#a371f7" stroke-opacity=".45" stroke-dasharray="1 7" class="spinB"/>
        <circle r="46" fill="#0d1117" stroke="#30363d"/>
        <text class="logo" y="10" text-anchor="middle">go</text>
        <g class="spinA"><circle cx="100" r="5" fill="#3fb950"/></g>
        <g class="spinB"><circle cx="72" r="4" fill="#a371f7"/></g>
        <g class="spinC"><circle cx="-46" r="3" fill="#00ADD8"/></g>
      </g>
    </g>

    <!-- scanline -->
    <rect width="900" height="2" fill="#3fb950" opacity=".07">
      <animate attributeName="y" from="-10" to="350" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x=".5" y=".5" width="899" height="339" rx="14" fill="none" stroke="#30363d"/>
</svg>
